<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF1F2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ChekiPocket - 拍立得卡冊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Zen Maru Gothic', 'Inter', 'sans-serif'],
            marker: ['Caveat', 'Zen Maru Gothic', 'cursive'],
          },
          colors: {
            cheki: {
              paper: '#FFFDF9',
              dark: '#272228',
              surface: '#FFF7F9',
              accent: '#FF5C8A',
              border: '#F4D4DC'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
    input, textarea { user-select: text; }
    body { background-color: #FFF7F9; color: #272228; overflow-x: hidden; }
    .neo-box { border: 2.5px solid #272228; box-shadow: 3px 3px 0px #272228; }
    .neo-btn { border: 2px solid #272228; box-shadow: 2px 2px 0px #272228; transition: all 0.1s ease; }
    .neo-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #272228; }
    
    /* 3D Flip Card Styles */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    /* Desk Backgrounds */
    .desk-dots-brown {
      background-color: #3E2723;
      background-image: radial-gradient(#5D4037 20%, transparent 20%);
      background-size: 32px 32px;
    }
    .desk-pink-grid {
      background-color: #FCE4EC;
      background-image: linear-gradient(#F8BBD0 1.5px, transparent 1.5px), linear-gradient(90deg, #F8BBD0 1.5px, transparent 1.5px);
      background-size: 28px 28px;
    }
    .desk-blue-pastel {
      background-color: #E3F2FD;
      background-image: radial-gradient(#90CAF9 20%, transparent 20%);
      background-size: 30px 30px;
    }
    .desk-wood-light {
      background-color: #D7CCC8;
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 10px, transparent 10px, transparent 20px);
    }
    .desk-card-selected {
      outline: 3.5px dashed #FF5C8A;
      outline-offset: 6px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-24 flex flex-col max-w-md mx-auto relative">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-cheki-surface/95 backdrop-blur px-3 py-2.5 border-b-2 border-cheki-dark flex items-center justify-between gap-1">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-10 h-10 rounded-full bg-cheki-accent neo-btn flex items-center justify-center text-xl shrink-0 cursor-pointer" onclick="openBackupModal()" title="備份與還原">📸</div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5">
          <h1 class="font-black text-base tracking-tight truncate">ChekiPocket</h1>
          <span onclick="openBackupModal()" class="cursor-pointer text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-400 shrink-0">本機永久存</span>
        </div>
        <p id="headerStats" class="text-[11px] text-zinc-600 font-bold truncate">總計 0 張 · ★ 0 張最愛 · 3 個相簿</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="openBackupModal()" class="w-9 h-9 rounded-2xl bg-amber-100 neo-btn flex items-center justify-center text-base" title="備份與還原">📦</button>
      <button onclick="toggleSearchBar()" class="w-9 h-9 rounded-2xl bg-white neo-btn flex items-center justify-center text-base" title="搜尋">🔍</button>
      <button onclick="openAddModal()" class="px-3 py-2 rounded-2xl bg-cheki-accent text-white font-black text-xs neo-btn flex items-center gap-1">✨ 新增</button>
    </div>
  </header>

  <!-- Search Bar -->
  <div id="searchBar" class="hidden px-3 py-2 bg-pink-50 border-b-2 border-cheki-dark">
    <div class="flex gap-2">
      <input id="searchInput" type="text" placeholder="搜尋成員名稱、活動、備註..." oninput="renderCurrentTab()" class="w-full px-3 py-1.5 rounded-xl border-2 border-cheki-dark text-sm font-bold focus:outline-none">
      <button onclick="clearSearch()" class="px-3 py-1.5 rounded-xl bg-white neo-btn text-xs font-bold shrink-0">清除</button>
    </div>
  </div>

  <!-- Main Content Containers -->
  <main class="flex-1 p-3">

    <!-- TAB 1: ALBUMS (相簿) -->
    <section id="tab-albums" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-black text-lg">📚 我的相簿分類</h2>
        <button onclick="createNewAlbum()" class="px-3 py-1.5 rounded-xl bg-amber-200 neo-btn text-xs font-black">+ 新增相簿</button>
      </div>
      <div id="albumsGrid" class="grid grid-cols-2 gap-3"></div>

      <!-- 專屬備份與還原區塊 -->
      <div class="neo-box bg-white rounded-2xl p-3.5 space-y-2.5 mt-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xl">📦</span>
            <div>
              <h3 class="font-black text-sm">資料備份與還原</h3>
              <p class="text-[11px] text-zinc-500 font-bold">匯出 JSON 備份檔，換手機或轉平台隨時還原</p>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="exportAllData()" class="py-2.5 px-3 rounded-xl bg-emerald-300 neo-btn font-black text-xs flex items-center justify-center gap-1">
            ⬇️ 匯出備份檔
          </button>
          <label class="py-2.5 px-3 rounded-xl bg-amber-200 neo-btn font-black text-xs flex items-center justify-center gap-1 cursor-pointer text-center">
            ⬆️ 匯入還原
            <input type="file" accept=".json" class="hidden" onchange="importAllData(event)">
          </label>
        </div>
      </div>
    </section>

    <!-- TAB 2: BINDER (卡冊 - 已修復按鈕重疊問題) -->
    <section id="tab-binder" class="hidden space-y-3">
      <div class="flex items-center gap-2 w-full">
        <!-- 左側相簿分類獨立橫向滾動，絕不與右側最愛按鈕重疊 -->
        <div id="albumFilterPills" class="flex-1 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 pr-1"></div>
        <!-- 分隔線與固定在右側的最愛按鈕 -->
        <div class="h-5 w-[2px] bg-zinc-300 shrink-0"></div>
        <button onclick="toggleFavFilter()" id="favFilterBtn" class="px-3 py-1.5 rounded-full bg-white neo-btn text-xs font-black shrink-0">★ 最愛</button>
      </div>
      <div id="binderGrid" class="grid grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB 3: CALENDAR (日曆) -->
    <section id="tab-calendar" class="hidden space-y-3">
      <div class="neo-box bg-white rounded-2xl p-3">
        <div class="flex justify-between items-center mb-3">
          <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg bg-pink-100 neo-btn font-black">◀</button>
          <h3 id="calendarTitle" class="font-black text-base">2026 年 10 月</h3>
          <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg bg-pink-100 neo-btn font-black">▶</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-zinc-500 mb-1">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div id="calendarDays" class="grid grid-cols-7 gap-1"></div>
      </div>
      <div id="calendarDayList" class="space-y-2"></div>
    </section>

    <!-- TAB 4: DESK (桌布) -->
    <section id="tab-desk" class="space-y-2.5">
      <!-- Desk Toolbar -->
      <div class="neo-box bg-white rounded-2xl p-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <button onclick="scatterDeskCards()" class="px-3 py-1.5 rounded-full bg-cheki-accent text-white text-xs font-black neo-btn shrink-0">🎲 隨機灑落</button>
        <button onclick="neatArrangeDeskCards()" class="px-3 py-1.5 rounded-full bg-white text-xs font-black neo-btn shrink-0">🗂️ 整齊排列</button>
        <button onclick="cycleDeskTheme()" class="px-3 py-1.5 rounded-full bg-pink-100 text-xs font-black neo-btn shrink-0">🎨 換桌布</button>
      </div>

      <!-- Selected Card Info Bar -->
      <div class="neo-box bg-pink-100/90 rounded-2xl px-3 py-2 flex items-center justify-between gap-2">
        <span id="deskSelectedName" class="font-black text-sm truncate max-w-[100px]">點擊相片操作</span>
        <span class="px-2.5 py-0.5 rounded-full bg-white border border-cheki-dark text-[11px] font-bold text-zinc-700 shrink-0">💡 點擊相片翻面 / 雙指縮放</span>
        <button onclick="flipSelectedDeskCard()" class="px-3 py-1 rounded-full bg-white neo-btn text-xs font-black flex items-center gap-1 shrink-0">🔄 翻面</button>
      </div>

      <!-- Desk Canvas Area -->
      <div id="deskCanvas" class="desk-dots-brown neo-box rounded-3xl relative w-full h-[68vh] overflow-hidden touch-none"></div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t-2 border-cheki-dark px-6 py-2 flex justify-between items-center z-30">
    <button onclick="switchTab('albums')" id="nav-albums" class="flex flex-col items-center gap-0.5 text-zinc-400 font-bold text-xs">
      <span class="text-xl">📚</span><span>相簿</span>
    </button>
    <button onclick="switchTab('binder')" id="nav-binder" class="flex flex-col items-center gap-0.5 text-zinc-400 font-bold text-xs">
      <span class="text-xl">🎴</span><span>卡冊</span>
    </button>
    <button onclick="openAddModal()" class="w-12 h-12 -mt-5 rounded-full bg-cheki-accent text-white neo-box flex items-center justify-center text-2xl font-black">+</button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center gap-0.5 text-zinc-400 font-bold text-xs">
      <span class="text-xl">📅</span><span>日曆</span>
    </button>
    <button onclick="switchTab('desk')" id="nav-desk" class="flex flex-col items-center gap-0.5 text-cheki-accent font-black text-xs">
      <span class="text-xl">🪵</span><span>桌布</span>
    </button>
  </nav>

  <!-- INSPECT MODAL (詳細檢視視窗) -->
  <div id="inspectModal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col justify-between p-4">
    <div class="flex items-center justify-between bg-white px-3 py-2 rounded-2xl neo-box">
      <button onclick="closeInspectModal()" class="font-black text-sm px-2 py-1">✕ 關閉</button>
      <span id="inspectMemberTitle" class="font-black text-sm truncate max-w-[140px]"></span>
      <div class="flex items-center gap-1.5">
        <button onclick="openEditFromInspect()" class="w-9 h-9 rounded-xl bg-amber-100 neo-btn flex items-center justify-center">✏️</button>
        <button onclick="toggleInspectFav()" id="inspectFavBtn" class="w-9 h-9 rounded-xl bg-yellow-100 neo-btn flex items-center justify-center">⭐</button>
        <button onclick="deleteInspectCard()" class="w-9 h-9 rounded-xl bg-rose-100 neo-btn flex items-center justify-center">🗑️</button>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center my-4 overflow-hidden">
      <div onclick="toggleInspectFlip()" class="perspective-1000 cursor-pointer flex items-center justify-center w-full max-h-[70vh]">
        <div id="inspectFlipInner" class="transform-style-3d relative flex items-center justify-center">
          <!-- Front -->
          <div class="backface-hidden flex items-center justify-center">
            <img id="inspectImg" src="" class="max-h-[65vh] max-w-[85vw] object-contain rounded-lg shadow-2xl">
          </div>
          <!-- Back -->
          <div class="backface-hidden rotate-y-180 absolute inset-0 rounded-xl p-5 flex flex-col justify-between shadow-2xl border-2 border-white/40" id="inspectBackCard">
            <div class="text-xs font-bold opacity-80" id="inspectBackDate"></div>
            <div class="font-marker text-xl font-black text-center whitespace-pre-wrap break-words my-auto" id="inspectBackNote"></div>
            <div class="text-right text-xs font-black opacity-90" id="inspectBackMember"></div>
          </div>
        </div>
      </div>
      <p class="text-white/70 text-xs font-bold mt-3">👆 點擊相片可 3D 翻面查看背面筆記</p>
    </div>

    <button onclick="exportInspectImage()" class="w-full py-3 rounded-2xl bg-cheki-accent text-white font-black text-sm neo-box">📥 匯出相片</button>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div id="editCardModal" class="hidden fixed inset-0 z-[60] bg-black/75 flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-cheki-surface w-full max-w-md rounded-3xl neo-box p-4 space-y-3 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b-2 border-cheki-dark pb-2">
        <h3 id="modalTitle" class="font-black text-base">✨ 新增 / 編輯拍立得</h3>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-white neo-btn font-black">✕</button>
      </div>

      <!-- Upload & Rotate Section -->
      <div class="space-y-2">
        <div class="flex gap-2">
          <label class="flex-1 py-2.5 rounded-xl bg-pink-200 neo-btn text-center font-black text-xs cursor-pointer">
            📷 拍攝 / 選取相片
            <input id="photoInput" type="file" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
          </label>
          <button type="button" onclick="rotateUploadImage(90)" id="rotateBtn" class="hidden px-3 py-2 rounded-xl bg-white neo-btn text-xs font-black">↻ 旋轉 90°</button>
        </div>

        <div id="previewContainer" class="hidden flex flex-col items-center bg-zinc-900 rounded-2xl p-2">
          <img id="editPreviewImg" src="" class="max-h-56 object-contain rounded-lg">
        </div>
      </div>

      <!-- Metadata Inputs -->
      <div class="space-y-2.5">
        <div>
          <label class="text-xs font-black block mb-1">成員 / 偶像名稱 *</label>
          <input id="cardMemberInput" type="text" placeholder="例如：遠藤まりん" class="w-full px-3 py-2 rounded-xl border-2 border-cheki-dark font-bold text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-black block mb-1">拍攝日期</label>
            <input id="cardDateInput" type="date" class="w-full px-3 py-2 rounded-xl border-2 border-cheki-dark font-bold text-xs">
          </div>
          <div>
            <label class="text-xs font-black block mb-1">所屬相簿</label>
            <select id="cardAlbumInput" class="w-full px-3 py-2 rounded-xl border-2 border-cheki-dark font-bold text-xs bg-white"></select>
          </div>
        </div>

        <div>
          <label class="text-xs font-black block mb-1">背面筆記 / 簽名備註 (點擊翻面時顯示)</label>
          <textarea id="cardNoteInput" rows="2" placeholder="記錄當日對話、姿勢（例如 T pose）、活動名稱..." class="w-full px-3 py-2 rounded-xl border-2 border-cheki-dark font-bold text-xs"></textarea>
        </div>

        <div>
          <label class="text-xs font-black block mb-1">背面卡紙顏色</label>
          <div class="flex gap-2" id="backColorPicker">
            <button type="button" onclick="selectBackColor('#F472B6')" data-color="#F472B6" class="w-8 h-8 rounded-full bg-[#F472B6] border-2 border-cheki-dark"></button>
            <button type="button" onclick="selectBackColor('#60A5FA')" data-color="#60A5FA" class="w-8 h-8 rounded-full bg-[#60A5FA] border-2 border-cheki-dark"></button>
            <button type="button" onclick="selectBackColor('#A78BFA')" data-color="#A78BFA" class="w-8 h-8 rounded-full bg-[#A78BFA] border-2 border-cheki-dark"></button>
            <button type="button" onclick="selectBackColor('#34D399')" data-color="#34D399" class="w-8 h-8 rounded-full bg-[#34D399] border-2 border-cheki-dark"></button>
            <button type="button" onclick="selectBackColor('#FBBF24')" data-color="#FBBF24" class="w-8 h-8 rounded-full bg-[#FBBF24] border-2 border-cheki-dark"></button>
            <button type="button" onclick="selectBackColor('#FFFDF9')" data-color="#FFFDF9" class="w-8 h-8 rounded-full bg-[#FFFDF9] border-2 border-cheki-dark"></button>
          </div>
        </div>
      </div>

      <button onclick="saveCard()" class="w-full py-3 rounded-2xl bg-cheki-accent text-white font-black text-sm neo-box mt-2">💾 儲存拍立得</button>
    </div>
  </div>

  <!-- BACKUP / RESTORE MODAL (備份與還原視窗) -->
  <div id="backupModal" class="hidden fixed inset-0 z-[70] bg-black/75 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl neo-box p-4 space-y-3.5">
      <div class="flex justify-between items-center border-b-2 border-cheki-dark pb-2">
        <h3 class="font-black text-base">📦 資料備份與還原</h3>
        <button onclick="closeBackupModal()" class="w-8 h-8 rounded-full bg-pink-100 neo-btn font-black">✕</button>
      </div>
      <div class="bg-pink-50 border border-pink-200 rounded-xl p-2.5 text-xs text-zinc-700 font-bold leading-relaxed">
        💡 目前共有 <span id="backupCountText" class="text-cheki-accent font-black">0</span> 張拍立得。建議定期匯出備份檔保存於手機或雲端，換機或轉移網址時可一鍵還原！
      </div>
      <button onclick="exportAllData()" class="w-full py-3 rounded-xl bg-emerald-300 neo-btn font-black text-xs flex items-center justify-center gap-1.5">
        ⬇️ 匯出完整備份檔 (.json)
      </button>
      <label class="block w-full py-3 rounded-xl bg-amber-200 neo-btn font-black text-xs text-center cursor-pointer">
        ⬆️ 選取備份檔匯入還原 (.json)
        <input type="file" accept=".json,application/json" class="hidden" onchange="importAllData(event)">
      </label>
    </div>
  </div>

  <script>
    // --- IndexedDB Storage Engine ---
    const DB_NAME = 'ChekiPocketDB';
    const DB_VERSION = 1;
    let db;
    let cards = [];
    let albums = ['預設相簿', '遠藤まりん', '現場活動'];
    let currentTab = 'desk';
    let selectedAlbumFilter = 'ALL';
    let favOnlyFilter = false;
    let editingCardId = null;
    let currentUploadDataUrl = '';
    let selectedBackColor = '#60A5FA';
    let inspectingCardId = null;
    let selectedDeskCardId = null;
    let deskThemes = ['desk-dots-brown', 'desk-blue-pastel', 'desk-pink-grid', 'desk-wood-light'];
    let currentDeskThemeIdx = 0;
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          loadDataFromDB().then(resolve);
        };
        req.onerror = reject;
      });
    }

    async function loadDataFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction(['cards', 'meta'], 'readonly');
        const cardReq = tx.objectStore('cards').getAll();
        const albumReq = tx.objectStore('meta').get('albums');
        tx.oncomplete = () => {
          cards = (cardReq.result || []).sort((a, b) => b.createdAt - a.createdAt);
          if (albumReq.result && Array.isArray(albumReq.result.value) && albumReq.result.value.length > 0) {
            albums = albumReq.result.value;
          }
          updateHeaderStats();
          renderCurrentTab();
          resolve();
        };
      });
    }

    function saveCardToDB(card) {
      return new Promise((resolve) => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(card);
        tx.oncomplete = resolve;
      });
    }

    function deleteCardFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').delete(id);
        tx.oncomplete = resolve;
      });
    }

    function saveAlbumsToDB() {
      return new Promise((resolve) => {
        const tx = db.transaction('meta', 'readwrite');
        tx.objectStore('meta').put({ key: 'albums', value: albums });
        tx.oncomplete = resolve;
      });
    }

    function updateHeaderStats() {
      const favCount = cards.filter(c => c.fav).length;
      document.getElementById('headerStats').textContent = `總計 ${cards.length} 張 · ★ ${favCount} 張最愛 · ${albums.length} 個相簿`;
      const backupCountEl = document.getElementById('backupCountText');
      if (backupCountEl) backupCountEl.textContent = cards.length;
    }

    // --- Tab Switching ---
    function switchTab(tab) {
      currentTab = tab;
      ['albums', 'binder', 'calendar', 'desk'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);

    function getFilteredCards() {
      const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      return cards.filter(c => {
        if (selectedAlbumFilter !== 'ALL' && c.album !== selectedAlbumFilter) return false;
        if (favOnlyFilter && !c.fav) return false;
        if (q) {
          const matchMember = (c.member || '').toLowerCase().includes(q);
          const matchNote = (c.note || '').toLowerCase().includes(q);
          const matchAlbum = (c.album || '').toLowerCase().includes(q);
          return matchMember || matchNote || matchAlbum;
        }
        return true;
      });
    }

    // --- TAB 4: DESK (單擊直接翻面 + 自由拖曳 + 雙指縮放旋轉) ---
    function renderDesk() {
      const canvas = document.getElementById('deskCanvas');
      canvas.innerHTML = '';
      const rect = canvas.getBoundingClientRect();
      const cw = rect.width || 360;
      const ch = rect.height || 480;

      cards.forEach((card, idx) => {
        if (typeof card.deskX !== 'number') {
          card.deskX = 35 + ((idx * 55) % Math.max(120, cw - 160));
          card.deskY = 35 + ((idx * 65) % Math.max(140, ch - 210));
          card.deskRot = (idx % 2 === 0 ? 1 : -1) * (4 + (idx * 3) % 10);
          card.deskScale = 1;
          card.deskZ = idx + 1;
        }
        if (typeof card.deskFlipped !== 'boolean') card.deskFlipped = false;

        const el = document.createElement('div');
        el.dataset.id = card.id;
        el.className = `absolute perspective-1000 select-none touch-none cursor-grab ${selectedDeskCardId === card.id ? 'desk-card-selected' : ''}`;
        el.style.width = '145px';
        el.style.left = `${card.deskX}px`;
        el.style.top = `${card.deskY}px`;
        el.style.zIndex = card.deskZ || 1;
        el.style.transform = `rotate(${card.deskRot || 0}deg) scale(${card.deskScale || 1})`;

        const backColor = card.backColor || '#F472B6';
        const backText = (card.note && card.note.trim()) ? card.note : `${card.member || 'Cheki'}`;

        el.innerHTML = `
          <div class="desk-flip-inner transform-style-3d relative w-full ${card.deskFlipped ? 'rotate-y-180' : ''}">

              <img src="${card.image}" draggable="false" class="w-full h-auto block rounded-lg shadow-xl pointer-events-none">
            </div>
            <!-- 背面：筆記與簽名備註卡 -->
            <div class="backface-hidden rotate-y-180 absolute inset-0 rounded-xl shadow-xl p-3 flex flex-col justify-between items-center text-center pointer-events-none border border-white/40" style="background-color: ${backColor}; color: ${backColor === '#FFFDF9' ? '#272228' : '#FFFFFF'};">
              <div class="text-[10px] font-bold opacity-80 w-full text-left">${card.date || ''}</div>
              <div class="font-marker font-bold text-sm leading-snug line-clamp-5 break-words my-auto px-1">${backText}</div>
              <div class="text-[10px] font-black opacity-90 w-full text-right">${card.member || ''}</div>
            </div>
          </div>
        `;

        attachDeskCardInteractions(el, card);
        canvas.appendChild(el);
      });
    }

    function attachDeskCardInteractions(el, card) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;
      let movedDistance = 0;

      let isPinching = false;
      let startDist = 0;
      let startAngle = 0;
      let initScale = 1;
      let initRot = 0;

      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        bringCardToFront(card, el);

        isDragging = true;
        movedDistance = 0;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = card.deskX;
        initialTop = card.deskY;
        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointermove', (e) => {
        if (!isDragging || isPinching) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        movedDistance = Math.hypot(dx, dy);

        if (movedDistance > 3) {
          card.deskX = initialLeft + dx;
          card.deskY = initialTop + dy;
          el.style.left = `${card.deskX}px`;
          el.style.top = `${card.deskY}px`;
        }
      });

      el.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}

        // 單擊（移動距離 < 6px）直接翻轉 Cheki 正背面
        if (movedDistance < 6 && !isPinching) {
          card.deskFlipped = !card.deskFlipped;
          const inner = el.querySelector('.desk-flip-inner');
          if (inner) inner.classList.toggle('rotate-y-180', card.deskFlipped);
        }
        saveCardToDB(card);
      });

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinching = true;
          isDragging = false;
          const t1 = e.touches[0], t2 = e.touches[1];
          startDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          startAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
          initScale = card.deskScale || 1;
          initRot = card.deskRot || 0;
        }
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (isPinching && e.touches.length === 2) {
          const t1 = e.touches[0], t2 = e.touches[1];
          const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          const angle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
          card.deskScale = Math.min(2.2, Math.max(0.5, initScale * (dist / startDist)));
          card.deskRot = initRot + (angle - startAngle);
          el.style.transform = `rotate(${card.deskRot}deg) scale(${card.deskScale})`;
        }
      }, { passive: true });

      el.addEventListener('touchend', (e) => {
        if (e.touches.length < 2 && isPinching) {
          setTimeout(() => { isPinching = false; }, 100);
          saveCardToDB(card);
        }
      });
    }

    function bringCardToFront(card, el) {
      selectedDeskCardId = card.id;
      const maxZ = cards.reduce((m, c) => Math.max(m, c.deskZ || 1), 1);
      card.deskZ = maxZ + 1;
      el.style.zIndex = card.deskZ;

      document.querySelectorAll('#deskCanvas > div').forEach(node => {
        node.classList.toggle('desk-card-selected', Number(node.dataset.id) === card.id);

      document.getElementById('deskSelectedName').textContent = card.member || '未命名';

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        compressAndSetImage(ev.target.result);
      };
      reader.readAsDataURL(file);
    }

    function compressAndSetImage(dataUrl) {
      const img = new Image();
      img.onload = () => {
        const maxSide = 1200;
        let w = img.width, h = img.height;
        if (w > maxSide || h > maxSide) {
          if (w > h) { h = Math.round(h * (maxSide / w)); w = maxSide; }
          else { w = Math.round(w * (maxSide / h)); h = maxSide; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        currentUploadDataUrl = canvas.toDataURL('image/jpeg', 0.88);
        document.getElementById('editPreviewImg').src = currentUploadDataUrl;
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('rotateBtn').classList.remove('hidden');
      };
      img.src = dataUrl;
    }

    function rotateUploadImage(deg) {
      if (!currentUploadDataUrl) return;
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.height;
        canvas.height = img.width;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((deg * Math.PI) / 180);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        currentUploadDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        document.getElementById('editPreviewImg').src = currentUploadDataUrl;
      };
      img.src = currentUploadDataUrl;
    }

    async function saveCard() {
      if (!currentUploadDataUrl) {
        alert('請先選擇或拍攝一張拍立得相片！');
        return;
      }
      const member = document.getElementById('cardMemberInput').value.trim() || '遠藤まりん';
      const date = document.getElementById('cardDateInput').value;
      const album = document.getElementById('cardAlbumInput').value || albums[0];
      const note = document.getElementById('cardNoteInput').value;

      if (editingCardId) {
        const idx = cards.findIndex(c => c.id === editingCardId);
        if (idx > -1) {
          cards[idx] = {
            ...cards[idx],
            member, date, album, note,
            image: currentUploadDataUrl,
            backColor: selectedBackColor
          };
          await saveCardToDB(cards[idx]);
        }
      } else {
        const newCard = {
          id: Date.now(),
          createdAt: Date.now(),
          member, date, album, note,
          image: currentUploadDataUrl,
          backColor: selectedBackColor,
          fav: false,
          deskX: 40 + (cards.length * 35) % 160,
          deskY: 40 + (cards.length * 45) % 180,
          deskRot: (cards.length % 2 === 0 ? 1 : -1) * 6,
          deskScale: 1,
          deskZ: cards.length + 1,
          deskFlipped: false
        };
        cards.unshift(newCard);
        await saveCardToDB(newCard);
      }

      closeEditModal();
      updateHeaderStats();
      renderCurrentTab();
    }

    function exportAllData() {

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ChekiPocket_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importAllData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const importedCards = Array.isArray(parsed) ? parsed : (parsed.cards || parsed.chekis || []);
          const importedAlbums = Array.isArray(parsed.albums) ? parsed.albums : [];

          for (const alb of importedAlbums) {
            if (alb && !albums.includes(alb)) albums.push(alb);
          }

          let count = 0;
          for (const raw of importedCards) {
            const normalized = {
              id: raw.id || (Date.now() + Math.floor(Math.random() * 100000)),
              createdAt: raw.createdAt || Date.now(),
              member: raw.member || raw.idol || raw.name || '遠藤まりん',
              date: raw.date || new Date().toISOString().split('T')[0],
              album: raw.album || albums[0],
              note: raw.note || raw.memo || '',
              image: raw.image || raw.img || raw.dataUrl || '',
              backColor: raw.backColor || '#60A5FA',
              fav: Boolean(raw.fav || raw.favorite),
              deskX: typeof raw.deskX === 'number' ? raw.deskX : 45 + (count * 35) % 150,
              deskY: typeof raw.deskY === 'number' ? raw.deskY : 45 + (count * 45) % 170,
              deskRot: typeof raw.deskRot === 'number' ? raw.deskRot : (count % 2 === 0 ? 5 : -5),
              deskScale: raw.deskScale || 1,
              deskZ: raw.deskZ || (count + 1),
              deskFlipped: Boolean(raw.deskFlipped)
            };
            if (normalized.album && !albums.includes(normalized.album)) {
              albums.push(normalized.album);
            }
            if (normalized.image) {
              await saveCardToDB(normalized);
              count++;
            }
          }

          await saveAlbumsToDB();
          await loadDataFromDB();
          closeBackupModal();
          e.target.value = '';
          alert(`✅ 成功匯入還原 ${count} 張拍立得！`);
        } catch (err) {
          alert('❌ 備份檔案格式不正確，請確認選取的是 .json 備份檔！');
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDB();
    });
  </script>
</body>
</html>
